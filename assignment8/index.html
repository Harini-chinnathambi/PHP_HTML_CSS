<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Patient Registration Form</h2>

<form action="process.php" method="post">

<table>

<tr>
<td>Patient Name</td>
<td><input type="text" name="name" required></td>
</tr>

<tr>
<td>Age</td>
<td><input type="number" name="age" min="1" required></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender" value="Male" required> Male
<input type="radio" name="gender" value="Female"> Female
</td>
</tr>

<tr>
<td>Blood Group</td>
<td>
<select name="blood" required>
<option value="">Select</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>
</select>
</td>
</tr>

<tr>
<td>Mobile Number</td>
<td><input type="text" name="mobile" pattern="[0-9]{10}" required></td>
</tr>

<tr>
<td>Address</td>
<td>
<textarea name="address" rows="4" cols="25" required></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Register">
<input type="reset" value="Clear">
</td>
</tr>

</table>

</form>

</div>

</body>
</html>
